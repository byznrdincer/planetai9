[project]
name = "planetai"
version = "0.1.0"
description = "PlanetAI — Global AI Intelligence Platform (backend workspace)"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*", "apps/api", "services/ingest"]

[tool.uv.sources]
planetai-shared = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",   # FastAPI Depends() in argument defaults is the intended pattern
    "E501",   # long lines (seed strings, regexes) — line-length still formats
    "B904",   # raise ... from — not required for our HTTPException re-raises
    "SIM105", # contextlib.suppress vs try/except/pass — either is fine
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "E402"]
"infra/migrations/*" = ["E501", "F401", "UP"]

[tool.ruff.format]
# Alembic-generated revisions carry their own layout; hand-edits (stripping the
# FTS/trgm index drops) shouldn't trigger a formatting war.
exclude = ["infra/migrations/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "services/ingest/tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning"]
