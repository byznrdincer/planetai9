[project]
name = "planetai"
version = "0.1.0"
description = "PlanetAI — Global AI Intelligence Platform (backend workspace)"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*", "apps/api", "services/ingest"]

[tool.uv.sources]
planetai-shared = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "services/ingest/tests"]
