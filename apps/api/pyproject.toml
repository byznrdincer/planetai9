[project]
name = "planetai-api"
version = "0.1.0"
description = "PlanetAI read API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "planetai-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.2",
    "python-slugify>=8.0",
    "slowapi>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planetai_api"]
